[project]
name = "reader3"
version = "1.0.0"
description = "Self-hosted EPUB reader with an AI chat panel, highlights, and reading progress"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.14.2",
    "ebooklib>=0.20",
    "fastapi>=0.121.2",
    "jinja2>=3.1.6",
    "pydantic>=2.0",
    "uvicorn>=0.38.0",
]
